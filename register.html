<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - TechZone</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            max-width: 440px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="card auth-card mx-auto border-0 p-4 bg-white">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none fw-bold fs-2 text-primary">Tech<span class="text-dark">Zone</span></a>
                <h5 class="fw-bold mt-2 text-dark">Đăng Ký Tài Khoản</h5>
                <p class="text-muted small">Tạo tài khoản để mua sắm dễ dàng hơn</p>
            </div>

            <!-- Khối hiển thị thông báo -->
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <!-- Form Đăng Ký -->
            <form id="registerForm">
                <div class="mb-3">
                    <label for="regFullname" class="form-label small fw-semibold">Họ và Tên</label>
                    <input type="text" class="form-control" id="regFullname" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="mb-3">
                    <label for="regEmail" class="form-label small fw-semibold">Địa chỉ Email</label>
                    <input type="email" class="form-control" id="regEmail" placeholder="vd: user@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="regPassword" class="form-label small fw-semibold">Mật khẩu</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="Nhập mật khẩu (tối thiểu 6 ký tự)" minlength="6" required>
                </div>
                <div class="mb-4">
                    <label for="regConfirmPassword" class="form-label small fw-semibold">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control" id="regConfirmPassword" placeholder="Nhập lại mật khẩu" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Đăng Ký Ngay</button>
            </form>

            <hr class="text-muted my-3">

            <!-- Nút quay lại trang Đăng Nhập -->
            <div class="text-center">
                <p class="small text-muted mb-2">Đã có tài khoản?</p>
                <a href="login.html" class="btn btn-outline-primary w-100 py-2 fw-semibold">Đăng Nhập</a>
            </div>

            <div class="text-center mt-3">
                <a href="index.html" class="small text-decoration-none text-muted">← Quay về Trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const fullname = document.getElementById('regFullname').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const alertBox = document.getElementById('alertBox');

            // 1. Kiểm tra mật khẩu trùng khớp
            if (password !== confirmPassword) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Mật khẩu xác nhận không trùng khớp!';
                alertBox.classList.remove('d-none');
                return;
            }

            // 2. Lấy danh sách tài khoản hiện tại từ localStorage
            let users = JSON.parse(localStorage.getItem('techzone_users')) || [];

            // 3. Kiểm tra email đã được sử dụng chưa
            const isEmailExist = users.some(u => u.email === email);
            if (isEmailExist) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Email này đã được đăng ký. Vui lòng sử dụng email khác!';
                alertBox.classList.remove('d-none');
                return;
            }

            // 4. Lưu thông tin tài khoản mới vào localStorage
            const newUser = { fullname, email, password };
            users.push(newUser);
            localStorage.setItem('techzone_users', JSON.stringify(users));

            // 5. Thông báo đăng ký thành công và chuyển hướng về trang login.html
            alertBox.className = 'alert alert-success';
            alertBox.textContent = 'Đăng ký thành công! Đang chuyển đến trang đăng nhập...';
            alertBox.classList.remove('d-none');

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
