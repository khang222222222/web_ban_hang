<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - TechZone</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            max-width: 420px;
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <div class="container my-5">
        <div class="card auth-card mx-auto border-0 p-4 bg-white">
            <div class="text-center mb-4">
                <a href="index.html" class="text-decoration-none fw-bold fs-2 text-primary">Tech<span class="text-dark">Zone</span></a>
                <h5 class="fw-bold mt-2 text-dark">Đăng Nhập Tài Khoản</h5>
                <p class="text-muted small">Chào mừng bạn quay trở lại với TechZone</p>
            </div>

            <!-- Khối hiển thị thông báo -->
            <div id="alertBox" class="alert d-none" role="alert"></div>

            <!-- Form Đăng Nhập -->
            <form id="loginForm">
                <div class="mb-3">
                    <label for="loginEmail" class="form-label small fw-semibold">Địa chỉ Email</label>
                    <input type="email" class="form-control" id="loginEmail" placeholder="vd: user@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="loginPassword" class="form-label small fw-semibold">Mật khẩu</label>
                    <input type="password" class="form-control" id="loginPassword" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label small" for="rememberMe">Ghi nhớ đăng nhập</label>
                    </div>
                    <a href="#" class="small text-decoration-none">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Đăng Nhập</button>
            </form>

            <hr class="text-muted my-3">

            <!-- Nút chuyển sang trang Đăng Ký -->
            <div class="text-center">
                <p class="small text-muted mb-2">Chưa có tài khoản?</p>
                <a href="register.html" class="btn btn-outline-secondary w-100 py-2 fw-semibold">Tạo Tài Khoản Mới</a>
            </div>
            
            <div class="text-center mt-3">
                <a href="index.html" class="small text-decoration-none text-muted">← Quay về Trang chủ</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const alertBox = document.getElementById('alertBox');

            // Lấy danh sách tài khoản đã đăng ký từ localStorage
            const users = JSON.parse(localStorage.getItem('techzone_users')) || [];

            // Tìm tài khoản khớp email & password
            const user = users.find(u => u.email === email && u.password === password);

            if (user) {
                // Hiển thị thông báo thành công
                alertBox.className = 'alert alert-success';
                alertBox.textContent = `Đăng nhập thành công! Chào mừng ${user.fullname} quay trở lại. Đang chuyển hướng...`;
                alertBox.classList.remove('d-none');

                // Lưu trạng thái đã đăng nhập
                localStorage.setItem('techzone_current_user', JSON.stringify(user));

                // Chuyển hướng sang trang index.html sau 1.5 giây
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } else {
                // Hiển thị thông báo thất bại
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'Email hoặc mật khẩu không chính xác!';
                alertBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
